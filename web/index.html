<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web TV - Neon Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tv-container" id="app-container">
        <!-- Reproductor de Video en Fondo -->
        <div class="player-container">
            <video id="tv-player" autoplay playsinline></video>
        </div>

        <!-- Menú Lateral Flotante Neón -->
        <div class="sidebar" id="sidebar">
            <!-- Encabezado con Nombre y Control de Luz -->
            <div class="sidebar-header">
                <h1 class="app-title">⚡ StratusNEX TV</h1>
                <button id="light-toggle-btn" class="focusable" tabindex="0" title="Apagar / Encender luz">💡</button>
            </div>
            
            <div class="category-filter">
                <select id="category-select" class="focusable" tabindex="0">
                    <option value="ALL">⚡ Todas las Categorías</option>
                </select>
            </div>

            <ul id="channel-list">
                <!-- Canales dinámicos -->
            </ul>
        </div>

        <!-- OSD minimalista neón -->
        <div class="osd-info" id="osd-info">
            <span id="current-channel-name">Cargando canal...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
