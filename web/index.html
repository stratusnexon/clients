<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web TV App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tv-container">
        <!-- Menú lateral de canales -->
        <div class="sidebar" id="channel-list">
            <h2>Canales</h2>
            <ul>
                <!-- Los elementos de lista deben tener la clase 'focusable' para el control remoto -->
                <li class="focusable active" tabindex="0" data-stream="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">Canal 1: Demo HLS</li>
                <li class="focusable" tabindex="0" data-stream="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">Canal 2: Big Buck Bunny</li>
                <li class="focusable" tabindex="0" data-stream="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4">Canal 3: Elephants Dream</li>
            </ul>
        </div>

        <!-- Reproductor de Video -->
        <div class="player-container">
            <video id="tv-player" controls autoplay></video>
        </div>
    </div>

    <!-- Librería HLS.js por si necesitas reproducir streams .m3u8 en navegadores que no lo soportan nativamente -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
