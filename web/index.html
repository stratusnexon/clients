<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web TV Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tv-container">
        <!-- Menú lateral de canales dinámico -->
        <div class="sidebar">
            <h2>Lista de Canales</h2>
            <ul id="channel-list">
                <!-- Se cargarán dinámicamente desde el script -->
            </ul>
        </div>

        <!-- Reproductor de Video -->
        <div class="player-container">
            <video id="tv-player" controls autoplay></video>
        </div>
    </div>

    <!-- Librería HLS.js para streams .m3u8 / HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
